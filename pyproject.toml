[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-approval-system"
version = "0.1.0"
description = "Multi-Agent Agentic AI Loan Approval System"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "streamlit==1.28.1",
    "langgraph==0.0.44",
    "langchain==0.1.0",
    "anthropic==0.18.0",
    "fastmcp==0.3.0",
    "pydantic==2.5.0",
    "python-dotenv==1.0.0",
    "httpx==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api", "agents", "orchestration", "ui", "mcp_servers", "tests"]
